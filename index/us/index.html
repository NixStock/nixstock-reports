<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NixStock 리포트 뷰어</title>
<meta name="description" content="리포트 종류·국가마다 날짜 없는 고정 주소 하나 — 열면 최신 날짜의 대표 문서가 보이고, 날짜·문서를 골라 볼 수 있다. 같은 사이트의 목록 파일(reports_manifest.json)에서 구성한다.">
<!--
  reports_viewer.html — 정본: StockProjectV2.0/docs/nix_report_directives/reports_viewer.html
  (사용자 2026-10-06 "대시보드에 최종일 디폴트로 보이고 날짜 선택 기능" · 공개 Pages 고정 주소 · 전 리포트)
  배포: deploy_reports_ghpages.sh → nix_pages_manifest.py --site-pages on 이 커밋된 HEAD 판을 고정 주소 9곳의 index.html 로 배치
        {market,tactical,cardnews,rrg}/{kr,us}/index.html + index/us/index.html (목록 SSOT = nix_pages_manifest.SITE_PAGES).
        이 파일을 고쳐도 커밋 → 다음 배포 때 자동 반영 (수동 cp 없음).
  동작: 주소(…/{종류}/{국가}/)에서 종류·국가 판단 → 같은 사이트 루트의 reports_manifest.json 1회 GET →
        분류기(nix-classify · reports_index.html 과 바이트까지 같은 블록 — 테스트가 강제) → 날짜 폴더(묶음)별 문서 목록 →
        쿼리 없음 = 최신 날짜의 대표 문서 · 날짜/문서/빠른 탭 선택 = ?d=YYYY-MM-DD&f=파일명 (공유 가능 · 뒤로 가기 됨).
        목록 파일을 못 읽거나 형식이 틀리면 원인을 화면에 표시한다 (조용한 빈 화면 없음).
        iframe 에는 목록 파일에 있는 경로만 넣는다 (쿼리로 임의 주소를 열 수 없음).
  시험: scripts/test_pages_latest_viewer.py (node 코어 시험 + playwright 렌더 · 서버 없음)
        ?k=<종류>&c=<국가> = 사이트 루트에 둔 사본으로 시험할 때 (고정 주소가 아닌 곳)
  색: reports_index.html 의 다크 토큰 그대로 (리포트와 같은 다크 · 라이트 없음).
-->
<style>
:root{
  --bg:#14161B; --card:#1C1F26; --card2:#21252E; --card3:#191C22;
  --line:#2E333B; --line2:#3A404B;
  --ink:#E7E9ED; --ink2:#B4BCC8; --ink3:#A9B3C1;
  --gold:#D4AF6A; --gold-bg:#241C10; --gold-bd:rgba(212,175,106,.42);
  --link:#6B9BE0; --thbg:#252C38; --thbg2:#2B3342; --think:#E4E8EF;
  --warn:#D6803F; --warn-bg:#2A2418;
  --err:#E8645F; --err-bg:#241C20; --err-bd:rgba(232,100,95,.42);
  --focus:#D4AF6A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",system-ui,sans-serif}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 상단 바 (고정 높이 영역 · 아래 iframe 이 나머지 전부) */
.bar{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 6px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.row+.row{margin-top:6px}
.brand{font-weight:800;font-size:16px;white-space:nowrap;color:var(--gold);margin-right:2px}
.brand:hover{text-decoration:none;color:var(--ink)}
.fld{display:inline-flex;min-width:0;max-width:100%}
select{background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font-size:13.5px;
  min-width:0;max-width:100%;height:32px}
select:disabled{color:var(--ink2);opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--ink2);padding:0 12px;height:30px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--thbg2);color:var(--ink);font-weight:700}
.seg button:disabled{color:var(--line2);cursor:not-allowed;text-decoration:line-through}
.dnav{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.nb{background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;width:32px;height:32px;padding:0;cursor:pointer;flex:0 0 auto}
.nb:disabled{color:var(--line2);cursor:not-allowed}
.nb:not(:disabled):hover{border-color:var(--gold)}
.fld.doc{flex:1 1 320px;max-width:560px}
.fld.doc select{width:100%}
.btn{display:inline-flex;align-items:center;height:32px;background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;
  padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.btn:hover{border-color:var(--gold);text-decoration:none}
.btn[aria-disabled="true"]{color:var(--ink2);pointer-events:none;opacity:.7}
.btn .sm{display:none}
.meta{font-size:12.5px;color:var(--ink2);min-width:0}
.meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* 빠른 탭 (대표·주요 문서) — 줄 안에서만 가로 스크롤 (페이지 가로 스크롤 아님) */
.tabs{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;margin-top:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;min-width:0}
.tabs:empty{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:20px;
  background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--gold)}
.tab[aria-current="page"]{border-color:var(--gold-bd);background:var(--gold-bg);color:var(--gold);font-weight:700}

/* 안내 — 항목마다 1줄 · 시작 마크(⚠️ 주의 / ℹ️ 안내) */
.notes{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.notes:empty{display:none}
.n{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.5;padding:4px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--card)}
.n.warn{border-color:var(--warn);background:var(--warn-bg)}
.n .mk{flex:0 0 auto}
.n .tx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.n .x{flex:0 0 auto;background:none;border:0;color:var(--ink2);cursor:pointer;padding:0 4px;font-size:14px;line-height:1.3}
.n .x:hover{color:var(--ink)}

/* 본문 = iframe 전체 높이 */
main.stage{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.msg{position:absolute;inset:0;overflow:auto;padding:20px 16px}
.loading{color:var(--ink2)}
.err{max-width:880px;border:1px solid var(--err-bd);border-left:4px solid var(--err);background:var(--err-bg);border-radius:10px;padding:14px 16px}
.err.empty{border-color:var(--line2);border-left-color:var(--gold);background:var(--card)}
.err h2{margin:0 0 8px;font-size:17px;color:var(--err)}
.err.empty h2{color:var(--gold)}
.err p{margin:4px 0;overflow-wrap:anywhere}
.err .why{font-weight:600}
.err ul{margin:6px 0 2px;padding-left:20px}
.err li{margin:2px 0}
.err .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pth{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3);overflow-wrap:anywhere}

:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

@media (max-width:700px){
  .bar{padding:6px 12px 4px}
  select{font-size:16px;height:34px}              /* iOS: 16px 미만이면 포커스 때 확대 */
  .seg button{height:32px}
  .nb{width:34px;height:34px}
  .btn{height:34px}
  .dnav{flex:1 1 100%}
  .dnav .fld{flex:1 1 auto}
  .dnav select{width:100%}
  .fld.doc{flex:1 1 100%;max-width:100%}
  .meta{display:none}
  .btn .lg{display:none}
  .btn .sm{display:inline}
  .msg{padding:16px 12px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="row">
    <a class="brand" id="brand" href="../../reports_index.html" title="전체 리포트 목록 (reports_index.html)">NixStock</a>
    <label class="fld"><span class="sr">리포트 종류</span><select id="kind" aria-label="리포트 종류"></select></label>
    <div class="seg" id="cty" role="group" aria-label="국가"></div>
    <div class="dnav">
      <button class="nb" id="older" type="button" aria-label="이전 날짜 (더 오래된 날짜)" title="이전 날짜 (더 오래된 날짜)" disabled>◀</button>
      <label class="fld"><span class="sr">날짜</span><select id="date" aria-label="날짜" disabled><option>날짜</option></select></label>
      <button class="nb" id="newer" type="button" aria-label="다음 날짜 (더 최근 날짜)" title="다음 날짜 (더 최근 날짜)" disabled>▶</button>
    </div>
  </div>
  <div class="row">
    <label class="fld doc"><span class="sr">문서</span><select id="doc" aria-label="같은 날짜 안의 문서" disabled><option>문서</option></select></label>
    <a class="btn" id="newtab" target="_blank" rel="noopener" aria-disabled="true" title="지금 보는 문서를 새 탭에서 열기">새 탭 ↗</a>
    <button class="btn" id="copy" type="button" disabled title="지금 보는 날짜·문서로 고정된 주소를 복사합니다"><span class="lg">링크 복사</span><span class="sm">복사</span></button>
    <a class="btn" id="latest" href="./" title="날짜 없는 고정 주소 — 항상 최신 날짜의 대표 문서"><span class="lg">최신으로</span><span class="sm">최신</span></a>
    <span class="meta" id="meta"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="대표·주요 문서 바로 열기"></nav>
  <div class="notes" id="notes" aria-live="polite"></div>
</header>
<main class="stage" id="stage">
  <div class="msg loading" id="msg" role="status">목록 불러오는 중…</div>
  <iframe id="frame" title="리포트" hidden></iframe>
</main>

<script id="nix-classify">
/* ── 분류기 (순수 함수 · DOM 없음) ── 노드 검증 스크립트가 이 블록만 떼어 같은 코드로 분류표를 만든다. */
(function (root) {
  'use strict';
  var D = '\\d{4}-\\d{2}-\\d{2}';
  var KC = '(?:kr|us)';
  function R(s) { return new RegExp('^' + s + '$'); }

  // 타입별 날짜 폴더 (경로의 날짜 = 이 폴더 날짜 · 파일명 날짜 아님)
  var MT = 'market/(?<d>' + D + ')_(?<c>kr|us)_market_temp_close/';
  var TC = 'tactical/(?<d>' + D + ')_(?<c>kr|us)_tactical_close/';
  var IX = 'index/(?<d>' + D + ')_(?<c>kr|us)_index_overview_close/';
  var RG = 'rrg/(?<c>kr|us)/(?<d>' + D + ')_rrg_alltickers_' + KC + '_close/';
  var TS = 'toss/(?<c>kr|us)/(?<d>' + D + ')_' + KC + '_toss_(?<k>[a-z]+)_(?<hm>\\d{4})/';
  var NW = 'news/(?<d>' + D + ')_daily_news_report/';
  // 티커 묶음 = {D}_{c}_{코드}_{이름} · 이름 없음 {D}_{c}_{코드} · 옛 {D}_{c}_ticker_{코드}_{이름} · 나라 없음 {D}_ticker_{코드}_{이름}
  var TK = 'ticker/(?<d>' + D + ')_(?:(?<c>kr|us)_)?(?:ticker_)?(?<t>[^_/]+)(?:_(?<s>[^/]+))?/';
  var TKD = '(?:' + D + '|\\d{8})';   // 옛 파일명 날짜 YYYYMMDD 도 받는다
  var CN = 'cardnews/(?<d>' + D + ')_(?<c>kr|us)_cardnews_close/';

  // 지수 폴더 → 이름·순서 (리포트 <title> 기준)
  var IDX = {
    kr:        { o: 0, l: '통합 (KS200+KQ150)' },
    kospi200:  { o: 1, l: '코스피200' },
    kosdaq150: { o: 2, l: '코스닥150' },
    us1500:    { o: 0, l: 'S&P Composite 1500 (통합)' },
    us500:     { o: 1, l: 'S&P 500' },
    us100:     { o: 2, l: '나스닥 100' },
    us30:      { o: 3, l: '다우 존스 30' },
    us400:     { o: 4, l: 'S&P MidCap 400' },
    us2000:    { o: 5, l: '러셀 2000' }
  };
  function idxL(i) { return IDX[i] ? IDX[i].l : String(i).toUpperCase(); }
  function idxO(i) { return IDX[i] ? IDX[i].o : 9; }
  var TF = { d: '일봉', w: '주봉', m: '월봉', dwm: '일·주·월 묶음' };
  // 토스 슬롯 종류 (nix_toss_slots.json 의 label 과 같은 말)
  var TOSS_KIND = { premarket: '장전', pre: '장전', intraday: '장중', close: '장마감', nxt: 'NXT애프터' };
  function hhmm(s) { return s ? s.slice(0, 2) + ':' + s.slice(2) : ''; }
  function slot(g) { return (TOSS_KIND[g.k] || g.k) + ' ' + hhmm(g.hm); }
  function tossOrd(g, sub) { return Number(g.hm) * 100 + sub; }
  function base(p) { return p.slice(p.lastIndexOf('/') + 1); }
  function slugName(s) {
    return String(s).replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Za-z])(\d)/g, '$1 $2').replace(/(\d)([A-Z][a-z])/g, '$1 $2');
  }

  var SECTIONS = [
    { id: 'market_kr',   label: '마켓온도 KR' },
    { id: 'market_us',   label: '마켓온도 US' },
    { id: 'tactical_kr', label: '택티컬 KR' },
    { id: 'tactical_us', label: '택티컬 US' },
    { id: 'index_us',    label: '인덱스 US' },
    { id: 'index_kr',    label: '인덱스 KR', optional: true },
    { id: 'rrg_kr',      label: 'RRG KR' },
    { id: 'rrg_us',      label: 'RRG US' },
    { id: 'cardnews_kr', label: '카드뉴스 KR' },
    { id: 'cardnews_us', label: '카드뉴스 US' },
    { id: 'toss_kr',     label: '토스 KR' },
    { id: 'toss_us',     label: '토스 US' },
    { id: 'news',        label: '뉴스' },
    { id: 'ticker',      label: '티커' },
    { id: 'etc',         label: '기타' }
  ];

  // ★분류 규칙 표 (위에서부터 첫 일치 1개) — 경로는 저장소 루트 기준
  //  [규칙, 섹션({c}=국가), 경로 정규식, 기본 표시, 정렬, 라벨]
  //  기본 표시: 1 = 주요(기본 화면) · 0 = "모든 파일 보기"에서만
  //            'toss' = 슬롯 대표 페이지 전부 주요 · 그중 대표(rep) = 그날 마감(close) 슬롯만 · 마감이 없는 날은 대표 없음
  //            'rrg'  = 같은 폴더에 rrg_alltickers 가 없을 때만 주요
  //  섹션 null = 목록에서 제외(사이트 자체 페이지)
  var RULES = [
    ['site_root',   null,          R('(?:(?:market|tactical|index|cardnews|rrg)/(?:kr|us)/)?(?:index|reports_index)\\.html'), 0, 0, null],

    ['mt_ig',       'market_{c}',  R(MT + 'infographic/market_temp_' + KC + '_comparison_infographic_' + D + '\\.html'), 1, 0,
      function () { return '비교 인포그래픽'; }],
    ['mt_igp',      'market_{c}',  R(MT + 'infographic/market_temp_' + KC + '_comparison_infographic_' + D + '_p(?<p>\\d+)\\.html'), 0,
      function (g) { return 50 + Number(g.p); }, function (g) { return '비교 인포그래픽 ' + g.p + '쪽'; }],
    ['mt_us_rep',   'market_{c}',  R(MT + 'overview/(?<i>us\\d+)/market_temp_\\k<i>_' + D + '\\.html'), 1,
      function (g) { return 10 + idxO(g.i); }, function (g) { return idxL(g.i) + ' 리포트'; }],
    ['mt_kr_rep',   'market_{c}',  R(MT + 'overview/(?<i>[a-z0-9]+)/market_temp_web_kr_report_\\k<i>_' + D + '\\.html'), 1,
      function (g) { return 10 + idxO(g.i); }, function (g) { return idxL(g.i) + ' 리포트'; }],
    ['mt_tbl',      'market_{c}',  R(MT + 'overview/(?<i>[a-z0-9]+)/market_temp_web_(?:kr_)?(?:[a-z0-9]+_)?(?<tf>dwm|d|w|m)_' + D + '\\.html'), 0,
      function (g) { return 60 + idxO(g.i); }, function (g) { return idxL(g.i) + ' 데이터 표 · ' + TF[g.tf]; }],
    ['mt_cmp',      'market_{c}',  R(MT + 'compare/market_temp_daily_compare_' + KC + '_(?<a>' + D + ')_to_(?<b>' + D + ')\\.html'), 0, 80,
      function (g) { return '일간 비교 ' + g.a + ' → ' + g.b; }],
    ['mt_flow',     'market_{c}',  R(MT + 'compare/market_temp_flow_5d_' + KC + '_' + D + '\\.html'), 0, 81,
      function () { return '5일 흐름'; }],
    ['mt_other',    'market_{c}',  R(MT + '.+\\.html'), 0, 99, function (g, p) { return base(p); }],

    ['tc_ov',       'tactical_{c}', R(TC + 'overview/' + KC + '_tactical_overview_' + D + '\\.html'), 1, 0,
      function () { return '택티컬 overview'; }],
    ['tc_ig',       'tactical_{c}', R(TC + 'infographic/' + KC + '_tactical_infographic_' + D + '\\.html'), 1, 1,
      function () { return '택티컬 인포그래픽'; }],
    ['tc_igp',      'tactical_{c}', R(TC + 'infographic/' + KC + '_tactical_infographic_' + D + '_p(?<p>\\d+)\\.html'), 0,
      function (g) { return 50 + Number(g.p); }, function (g) { return '택티컬 인포그래픽 ' + g.p + '쪽'; }],
    ['tc_trend',    'tactical_{c}', R(TC + 'overview/daily_trend_buysell_' + KC + '_' + D + '\\.html'), 0, 60,
      function () { return '데일리 추세 매수·매도'; }],
    ['tc_bd',       'tactical_{c}', R(TC + 'overview/tactical_backdata_' + KC + '_' + D + '\\.html'), 0, 61,
      function () { return '택티컬 백데이터'; }],
    ['tc_rrg',      'tactical_{c}', R(TC + 'overview/tactical_rrg_web_' + KC + '_' + D + '\\.html'), 0, 62,

        });
      }
      return res.json().catch(function (err) {
        throw new Error('응답 JSON 을 해석하지 못했습니다 — ' + (err && err.message || err) + ' (목록 파일이 깨졌거나 JSON 이 아닌 응답이 왔습니다)');
      });
    }).then(function (j) {
      var mf = V.parseManifest(j);
      GEN = mf.gen;
      B = V.bundles(mf.paths, SLOT.k, SLOT.c);
      if (!B.length) { showEmpty(); return; }
      renderDates();
      var r = V.resolve(B, readQuery());
      show(r.bi, r.doc, { notes: r.notes });   // 첫 표시는 주소를 바꾸지 않는다 (맨 고정 주소 = 항상 최신)
    }).catch(function (err) { showError(err, MURL); });
  }

  renderSlotControls();
  if (SLOT.error) showError(new Error(SLOT.error), '');
  else load();
})();
</script>
</body>
</html>
